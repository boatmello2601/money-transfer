services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bank-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: bank-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bank-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "YourStrong!Passw0rd" -C
      -Q "IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'bankdb') CREATE DATABASE bankdb"
    restart: "no"

  ibmmq:
    image: icr.io/ibm-messaging/mq:latest
    container_name: bank-ibmmq
    environment:
      LICENSE: "accept"
      MQ_QMGR_NAME: "QM1"
      MQ_APP_PASSWORD: "AppPass123"
      MQ_ADMIN_PASSWORD: "AdminPass123"
    ports:
      - "1414:1414"
      - "9443:9443"
    volumes:
      - ibmmq-data:/mnt/mqm
      - ./mqsc/20-config.mqsc:/etc/mqm/20-config.mqsc:ro
    healthcheck:
      test: [ "CMD", "chkmqready" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  ibmmq-init:
    image: docker:cli
    container_name: bank-ibmmq-init
    depends_on:
      ibmmq:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mqsc/grant-auth.sh:/grant-auth.sh:ro
    entrypoint: [ "sh", "/grant-auth.sh" ]
    restart: "no"

volumes:
  sqlserver-data:
  ibmmq-data: